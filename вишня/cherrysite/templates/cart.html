<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина - PC-SHOP</title>
    <link rel="stylesheet" href="../static/css/cart.css">
    <!-- Подключаем иконки, так как в корзине есть кнопки удаления -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Небольшой кастомный стиль для таблицы корзины -->
    <style>
        .cart-table-container {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 30px;
        }
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
            background-color: #ffffff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            overflow: hidden;
        }
        .cart-table thead {
            background-color: #f8f9fa;
            border-bottom: 2px solid #eee;
        }
        .cart-table th {
            padding: 15px 20px;
            text-align: left;
            font-weight: 600;
            color: #555;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .cart-table td {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }
        .cart-table tr:last-child td {
            border-bottom: none;
        }
        .cart-item-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #f5f5f5;
        }
        .cart-item-info {
            flex-grow: 1;
        }
        .cart-item-name {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 5px;
        }
        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .cart-item-quantity {
            width: 60px;
            padding: 8px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .remove-from-cart {
            background: transparent;
            border: none;
            color: #999;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .remove-from-cart:hover {
            color: #dc3545;
        }
        .cart-summary-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        .summary-text {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
        }
        .summary-price {
            font-size: 28px;
            font-weight: 800;
            color: #222;
        }
        .cart-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #1a1a1a;
            color: #1a1a1a;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-outline:hover {
            background-color: #1a1a1a;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Шапка сайта (копируем из основного шаблона) -->
    <header>
        <nav>
            <div>
                <a href="/">PC-SHOP</a>
            </div>
            <ul>
                <li><a href="/">Главная</a></li>
                <li><a href="/catalog/">Каталог</a></li>
                <li><a href="#">О магазине</a></li>
            </ul>
            <div>
                <a href="/cart/">Корзина (<span id="nav-cart-count">0</span>)</a>
                <a href="/login/">Войти</a>
            </div>
        </nav>
    </header>

    <main>
        <!-- Заголовок страницы -->
        <h1 style="margin: 40px 0 20px 0; font-size: 32px; color: #1a1a1a;">Ваша корзина</h1>

        <!-- Блок для сообщения "Корзина пуста" -->
        <div id="emptyCartMessage" style="text-align: center; padding: 60px 20px; color: #666; display: none;">
            <i class="fas fa-shopping-cart" style="font-size: 60px; margin-bottom: 20px; opacity: 0.5;"></i>
            <h2>Ваша корзина пуста</h2>
            <p style="margin-top: 10px;">Добавьте товары, чтобы оформить заказ.</p>
            <a href="/catalog/" class="buy-button" style="margin-top: 20px; display: inline-block;">Перейти в каталог</a>
        </div>

        <!-- Таблица товаров (скрыта, если корзина пуста) -->
        <div id="cartContent" style="display: none;">
            <div class="cart-table-container">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Товар</th>
                            <th>Цена</th>
                            <th>Количество</th>
                            <th>Сумма</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody">
                        <!-- Строки товаров будут добавлены сюда скриптом -->
                    </tbody>
                </table>
            </div>

            <!-- Итоговая информация -->
            <div class="cart-summary-box">
                <div>
                    <div class="summary-text">Итого к оплате:</div>
                    <div style="color: #666; font-size: 14px;">Включая НДС 20%</div>
                </div>
                <div class="summary-price" id="cartTotalPrice">0 ₽</div>
            </div>

            <!-- Кнопки действий -->
            <div class="cart-actions">
                <a href="/catalog/" class="btn-outline">Продолжить покупки</a>
                <button class="buy-button" style="flex-grow: 1;" id="checkoutBtn">Оформить заказ</button>
            </div>
        </div>
    </main>

    <!-- Подвал сайта -->
    <footer>
        <div>
            <p>&copy; 2026 PC-SHOP</p>
        </div>
    </footer>

    <!-- Кнопка "тык" (оставляем для единообразия) -->
    <button class="glow-button">
        <img src="https://avatars.mds.yandex.net/i?id=262a2266283d3365985dd8d017ff6a1afc509308-5306827-images-thumbs&n=13" alt="тык">
    </button>

    <!-- Шаблон строки таблицы -->
    <template id="cartRowTemplate">
        <tr>
            <td style="display: flex; align-items: center; gap: 20px;">
                <img src="" alt="" class="cart-item-img">
                <div class="cart-item-info">
                    <div class="cart-item-name"></div>
                    <div style="color: #666; font-size: 14px;"></div>
                </div>
            </td>
            <td class="item-price"></td>
            <td>
                <div class="cart-item-controls">
                    <button class="remove-from-cart">&times;</button>
                    <input type="number" class="cart-item-quantity" value="1" min="1">
                </div>
            </td>
            <td class="item-total"></td>
            <td><button class="remove-from-cart" title="Удалить">&times;</button></td>
        </tr>
    </template>

    <script>
        // Логика корзины (должна быть идентична логике на главной странице)
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        const navCartCount = document.getElementById('nav-cart-count');
        const cartTableBody = document.getElementById('cartTableBody');
        const cartTotalPrice = document.getElementById('cartTotalPrice');
        const cartContent = document.getElementById('cartContent');
        const emptyCartMessage = document.getElementById('emptyCartMessage');
        const cartRowTemplate = document.getElementById('cartRowTemplate');
        const checkoutBtn = document.getElementById('checkoutBtn');

        function renderCart() {
            cartTableBody.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                cartContent.style.display = 'none';
                emptyCartMessage.style.display = 'block';
            } else {
                cartContent.style.display = 'block';
                emptyCartMessage.style.display = 'none';

                cart.forEach(item => {
                    const row = cartRowTemplate.content.cloneNode(true);
                    
                    row.querySelector('.cart-item-img').src = `https://via.placeholder.com/80x80?text=${item.name.charAt(0)}`;
                    row.querySelector('.cart-item-name').textContent = item.name;
                    row.querySelector('.cart-item-info div:last-child').textContent = `ID: ${item.id}`;
                    row.querySelector('.item-price').textContent = `${item.price.toLocaleString()} ₽`;
                    row.querySelector('.cart-item-quantity').value = item.quantity;
                    row.querySelector('.item-total').textContent = `${(item.price * item.quantity).toLocaleString()} ₽`;

                    // Удаление товара
                    row.querySelectorAll('.remove-from-cart').forEach(btn => {
                        btn.addEventListener('click', () => {
                            cart = cart.filter(i => i.id !== item.id);
                            saveAndRender();
                        });
                    });

                    // Изменение количества
                    row.querySelector('.cart-item-quantity').addEventListener('change', (e) => {
                        const newQty = parseInt(e.target.value);
                        if (newQty > 0) {
                            item.quantity = newQty;
                            saveAndRender();
                        }
                    });

                    cartTableBody.appendChild(row);
                    total += item.price * item.quantity;
                });

                cartTotalPrice.textContent = `${total.toLocaleString()} ₽`;
                navCartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            }
        }

        function saveAndRender() {
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        // Оформление заказа (заглушка)
        checkoutBtn.addEventListener('click', () => {
            if (cart.length > 0) {
                alert('Переход на страницу оформления заказа...');
                // Здесь будет переход на /checkout/
                // localStorage.removeItem('cart'); // Очистка корзины после заказа
            } else {
                alert('Корзина пуста!');
            }
        });

        // Первичная отрисовка
        renderCart();
    </script>
</body>
</html>
